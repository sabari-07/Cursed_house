<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- installable: added to the home screen it opens with no browser bars (Android and iPhone) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#020204" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cursed House" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>The Cursed House</title>
    <!-- the title card: the witch cut out of the painting arrives first, so the moon is never empty -->
    <link rel="preload" as="image" href="/landing/title-witch.png" />
    <link rel="preload" as="image" href="/landing/title-graveyard.webp" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020204;
        font-family: 'Georgia', serif;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Touch screens: every button is at least 40 px tall, easy to hit with a thumb */
      @media (pointer: coarse) {
        button { min-height: 40px; }
      }
      /* A phone held upright: the game is played sideways (see App.tsx) */
      .turn-phone { display: none; }
      @media (pointer: coarse) and (orientation: portrait) and (max-width: 900px) {
        .turn-phone { position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; justify-items: center; gap: 14px;
          padding: 0 10vw; text-align: center; color: #e6d6b8; background: radial-gradient(ellipse at 50% 40%, #1a0b0b, #020204 75%); }
        .turn-phone-title { font: 26px 'Creepster', Georgia, serif; letter-spacing: .08em; color: #c8141b;
          text-shadow: 2px 2px 0 #1a0000, 0 0 14px rgba(160, 0, 0, .65); }
        .turn-phone p { font-size: 15px; line-height: 1.45; font-style: italic; }
        .turn-phone-icon { width: 46px; height: 78px; border: 3px solid #c9a45e; border-radius: 9px; animation: turnPhone 2.4s ease-in-out infinite; }
        @keyframes turnPhone { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
